name: Build & Push Showroom

on:
  push:
    branches: [showroom]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_BESKYTTELSESRUM_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gabel1998/beskyttelsesrum:showroom
            ghcr.io/gabel1998/beskyttelsesrum:showroom-${{ github.sha }}
